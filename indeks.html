<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Katak Kecil</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(#9ee7ff, #dff9ff);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .scene {
            position: relative;
            width: 800px;
            height: 500px;
            overflow: hidden;
            border-radius: 25px;
            background:
                linear-gradient(
                    to bottom,
                    #9ee7ff 0%,
                    #d9f8ff 65%,
                    #7fd36b 65%,
                    #54b84c 100%
                );
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        /* Matahari */

        .sun {
            position: absolute;
            width: 80px;
            height: 80px;
            background: #ffe27a;
            border-radius: 50%;
            top: 45px;
            right: 80px;
            box-shadow: 0 0 35px #ffe27a;
        }

        /* Awan */

        .cloud {
            position: absolute;
            width: 130px;
            height: 40px;
            background: white;
            border-radius: 50px;
            opacity: 0.8;
            animation: cloudMove 12s linear infinite;
        }

        .cloud::before,
        .cloud::after {
            content: "";
            position: absolute;
            background: white;
            border-radius: 50%;
        }

        .cloud::before {
            width: 55px;
            height: 55px;
            left: 20px;
            bottom: 10px;
        }

        .cloud::after {
            width: 70px;
            height: 70px;
            right: 20px;
            bottom: 5px;
        }

        .cloud1 {
            top: 90px;
            left: -150px;
        }

        .cloud2 {
            top: 160px;
            left: -300px;
            transform: scale(0.7);
            animation-delay: 4s;
        }

        @keyframes cloudMove {
            from {
                left: -180px;
            }

            to {
                left: 850px;
            }
        }

        /* Kolam */

        .pond {
            position: absolute;
            width: 430px;
            height: 125px;
            background: #5cc4d8;
            border-radius: 50%;
            bottom: 25px;
            left: 185px;
            box-shadow: inset 0 8px 15px rgba(255,255,255,0.25);
        }

        /* Katak */

        .frog {
            position: absolute;
            width: 130px;
            height: 110px;
            left: 335px;
            bottom: 85px;
            animation: frogBounce 1.5s ease-in-out infinite;
        }

        @keyframes frogBounce {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }
        }

        /* Badan */

        .body {
            position: absolute;
            width: 105px;
            height: 80px;
            background: #55bd55;
            border-radius: 50% 50% 45% 45%;
            bottom: 0;
            left: 12px;
            border: 3px solid #319b43;
        }

        /* Mata */

        .eye {
            position: absolute;
            width: 38px;
            height: 38px;
            background: #55bd55;
            border: 3px solid #319b43;
            border-radius: 50%;
            top: 0;
            z-index: 3;
        }

        .eye.left {
            left: 20px;
        }

        .eye.right {
            right: 20px;
        }

        .pupil {
            position: absolute;
            width: 13px;
            height: 17px;
            background: #172b1a;
            border-radius: 50%;
            top: 8px;
            left: 10px;
            animation: blink 4s infinite;
        }

        @keyframes blink {
            0%, 94%, 100% {
                transform: scaleY(1);
            }

            96% {
                transform: scaleY(0.1);
            }
        }

        /* Mulut */

        .mouth {
            position: absolute;
            width: 50px;
            height: 25px;
            border-bottom: 4px solid #246b32;
            border-radius: 0 0 50px 50px;
            left: 40px;
            top: 55px;
            z-index: 4;
        }

        /* Kaki */

        .leg {
            position: absolute;
            width: 45px;
            height: 25px;
            background: #55bd55;
            border: 3px solid #319b43;
            border-radius: 50%;
            bottom: -8px;
        }

        .leg.left {
            left: -12px;
            transform: rotate(-15deg);
        }

        .leg.right {
            right: -12px;
            transform: rotate(15deg);
        }

        /* Rumput */

        .grass {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 80px;
            background: #54b84c;
        }

        .grass::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 30px;
            top: -15px;
            background:
                repeating-linear-gradient(
                    120deg,
                    transparent 0px,
                    transparent 15px,
                    #3c9f43 16px,
                    #3c9f43 20px
                );
        }

        /* Teratai */

        .lily {
            position: absolute;
            width: 65px;
            height: 35px;
            background: #78d66d;
            border-radius: 50%;
        }

        .lily1 {
            left: 240px;
            bottom: 65px;
        }

        .lily2 {
            right: 210px;
            bottom: 48px;
            transform: scale(0.7);
        }

        /* Gelembung */

        .bubble {
            position: absolute;
            border: 2px solid rgba(255,255,255,0.7);
            border-radius: 50%;
            animation: bubbleUp 3s ease-in infinite;
            opacity: 0;
        }

        .bubble1 {
            width: 12px;
            height: 12px;
            left: 390px;
            bottom: 120px;
        }

        .bubble2 {
            width: 8px;
            height: 8px;
            left: 420px;
            bottom: 115px;
            animation-delay: 1s;
        }

        @keyframes bubbleUp {
            0% {
                transform: translateY(0);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            100% {
                transform: translateY(-100px);
                opacity: 0;
            }
        }

        /* Tulisan */

        .title {
            position: absolute;
            top: 25px;
            left: 30px;
            color: #287d3a;
            font-size: 22px;
            font-weight: bold;
        }

        /* Tombol */

        button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            background: white;
            color: #27853c;
            font-weight: bold;
            cursor: pointer;
            z-index: 20;
        }

        button:hover {
            transform: translateX(-50%) scale(1.05);
        }

    </style>
</head>

<body>

    <div class="scene">

        <div class="sun"></div>

        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>

        <div class="title">
            🐸 Little Frog
        </div>

        <div class="pond"></div>

        <div class="lily lily1"></div>
        <div class="lily lily2"></div>

        <div class="bubble bubble1"></div>
        <div class="bubble bubble2"></div>

        <!-- KATAK -->

        <div class="frog" id="frog">

            <div class="eye left">
                <div class="pupil"></div>
            </div>

            <div class="eye right">
                <div class="pupil"></div>
            </div>

            <div class="body"></div>

            <div class="mouth"></div>

            <div class="leg left"></div>
            <div class="leg right"></div>

        </div>

        <div class="grass"></div>

        <button onclick="jumpFrog()">
            Lompat! 🐸
        </button>

    </div>


    <script>

        function jumpFrog() {

            const frog = document.getElementById("frog");

            frog.style.animation = "none";

            setTimeout(() => {

                frog.style.animation =
                    "bigJump 0.8s ease-out";

            }, 10);

            setTimeout(() => {

                frog.style.animation =
                    "frogBounce 1.5s ease-in-out infinite";

            }, 850);
        }

        const style = document.createElement("style");

        style.innerHTML = `

            @keyframes bigJump {

                0% {
                    transform: translateY(0) rotate(0deg);
                }

                35% {
                    transform: translateY(-140px) rotate(-5deg);
                }

                70% {
                    transform: translateY(-80px) rotate(5deg);
                }

                100% {
                    transform: translateY(0) rotate(0deg);
                }

            }

        `;

        document.head.appendChild(style);

    </script>

</body>
</html>
